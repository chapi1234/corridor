# pre-commit install  →  runs on every commit; `pre-commit run -a` to check everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=600"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend exec prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        pass_filenames: true
      - id: frontend-eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend exec eslint --fix
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
